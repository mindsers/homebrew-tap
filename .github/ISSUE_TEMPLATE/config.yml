# A formula describes software that lives somewhere else, and that is where
# questions about the software get answered. Issues here are for the tap: a
# formula that will not install, a checksum that does not match, a version that
# never updated. Everything else is routed to the project it belongs to.
blank_issues_enabled: true
contact_links:
  - name: Something wrong with omh itself
    url: https://github.com/mindsers/ohmyharness/issues/new/choose
    about: >
      Bugs, features and questions about the tool. Note that its formula is
      generated from a template there, so a fix to the formula also belongs in
      that repository — a change made here is overwritten by the next release.
